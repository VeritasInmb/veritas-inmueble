# This file was auto-generated by the Firebase CLI and modified to support Next.js SSR
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and build
        run: npm ci && npm run build
      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VERITAS_INMUEBLE_2 }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-credentials.json
          npx firebase-tools experiments:enable webframeworks
          npx firebase-tools deploy --project veritas-inmueble-2 --non-interactive --force
